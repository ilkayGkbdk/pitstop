name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: catalog.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('plugins/model-coach/catalog.json','utf8'))"
      - name: bundled catalog is in sync
        run: node scripts/build-catalog.mjs --check
